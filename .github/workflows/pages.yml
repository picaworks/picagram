# Builds the catalog site on every pull request and every push to main, and publishes it to GitHub Pages from
# main. The build runs on macOS, so the thumbnails npm run verify captures use the same fonts a Mac does, and the
# whole gate runs first. On a pull request, the build job is the check branch protection requires before it can
# merge. See docs/architecture/site.md.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run lint
      - run: npm test
      - run: npm run build:registry
      # Captures every component's thumbnails while it checks them; they are not committed.
      - run: npm run verify -- --quick
      - run: npm run check:site
      # check:site builds with a test fixture in the catalog, so the published build is a clean one.
      - run: npx next build
      - run: touch out/.nojekyll
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
